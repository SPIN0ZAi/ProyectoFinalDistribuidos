name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore DistributedDiceGame.slnx

      - name: Build solution (Release)
        run: dotnet build DistributedDiceGame.slnx --no-restore -c Release

      - name: Run tests
        run: dotnet test DistributedDiceGame.slnx --no-build -c Release --verbosity normal
